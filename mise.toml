# Machine bootstrap and repository maintenance. Everyday tools live in dots/.config/mise/.
[settings.dotfiles]
root = "dots"

[vars]
dotfiles_repo = "{{ config_root }}"

nerdfonts_version = "v3.5.1"

[vars.git_name]
required = "Set your Git author name"
prompt = "Git author name"

[vars.git_email]
required = "Set your Git email"
prompt = "Git email"

[dotfile_groups.home]
root = "."
target = "~"
mode = "symlink-each"

[dotfile_groups.home.entries]
"~/.config/env.sh" = { source = ".config/env.sh.tera", mode = "template" }
"~/.config/git/config" = { source = ".config/git/config.tera", mode = "template" }

[bootstrap.packages]
# Ubuntu / Debian packages
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:fontconfig" = "latest"
"apt:git" = "latest"
"apt:less" = "latest"
"apt:bsdextrautils" = "latest"
"apt:openssh-client" = "latest"
"apt:procps" = "latest"
"apt:tar" = "latest"
"apt:xz-utils" = "latest"

# Fedora packages
# Requires mise with https://github.com/jdx/mise/pull/14347.
"dnf:@development-tools" = "latest"
"dnf:curl" = "latest"
"dnf:file" = "latest"
"dnf:fontconfig" = "latest"
"dnf:git" = "latest"
"dnf:less" = "latest"
"dnf:util-linux" = "latest"
"dnf:openssh-clients" = "latest"
"dnf:procps-ng" = "latest"
"dnf:tar" = "latest"
"dnf:xz" = "latest"

# Arch Linux packages
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:file" = "latest"
"pacman:fontconfig" = "latest"
"pacman:git" = "latest"
"pacman:less" = "latest"
"pacman:util-linux" = "latest"
"pacman:openssh" = "latest"
"pacman:procps-ng" = "latest"
"pacman:tar" = "latest"
"pacman:xz" = "latest"

[bootstrap.directories]
"~/repos/github/pszponder" = {}
"~/resources/courses" = {}
"~/resources/books" = {}
"~/resources/datasets" = {}
"~/resources/cheatsheets" = {}
"~/resources/notes" = {}
"~/scratch" = {}
"~/.ssh" = { mode = "0700" }
"~/.ssh/github" = { mode = "0700" }
"~/.ssh/github/pszponder" = { mode = "0700" }

[bootstrap.hooks]
final = [
  # A fresh invocation reads the global tools config deployed by dotfiles.
  "mise -C {{ vars.dotfiles_repo | quote }} -E {{ vars.dotfiles_profile | quote }} install --yes",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/cli/flox_install.sh",
  "bash {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/create_ssh_keys.sh",
  "NERDFONTS_VERSION={{ vars.nerdfonts_version | quote }} sh {{ vars.dotfiles_repo | quote }}/scripts/cli/nerdfonts_install.sh",
]

[tasks.test]
description = "Run offline tests with isolated home directories"
run = "python3 -m unittest discover -s tests -v"

[tasks.lint]
description = "Validate TOML and shell syntax"
run = "python3 scripts/check.py"

[tasks.check]
description = "Run all repository checks"
depends = ["lint", "test"]
