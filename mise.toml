# Repository maintenance. Machine setup lives in bootstrap/.
[tools]
betterleaks = "latest"

[tasks.hooks-install]
description = "Install Betterleaks and enable this repository's Git hooks"
run = [
    "mise install betterleaks",
    "sh scripts/bootstrap/configure_git_hooks.sh",
]

[tasks.secrets]
description = "Scan all locally available Git history for secrets"
run = "betterleaks git --redact --log-opts=--all"

[tasks.test]
description = "Run offline tests with isolated home directories"
run = "python3 -m unittest discover -s tests -v"

[tasks.lint]
description = "Validate TOML and shell syntax"
run = "python3 scripts/check.py"

[tasks.check]
description = "Run all repository checks"
depends = ["lint", "test"]

[tasks."setup:git"]
description = "Attach shared Git defaults while preserving local settings"
run = "sh scripts/bootstrap/configure_git.sh"

[tasks."setup:fonts"]
description = "Install fonts for the saved machine profile"
run = "mise -C bootstrap -E {{ vars.dotfiles_profile }} run setup:fonts"

[tasks."setup:kanata"]
description = "Configure keyboard access on workstations"
run = "{% if vars.dotfiles_profile != 'server' %}sh scripts/bootstrap/configure_kanata.sh{% else %}true{% endif %}"

[tasks."dotfiles:apply"]
description = "Apply dotfiles normally and offer a force retry on failure"
run = "DOTFILES_YES=${DOTFILES_YES:-0} sh scripts/bootstrap/retry_mise.sh dotfiles -C bootstrap -E {{ vars.dotfiles_profile }}"
