[vars]
dotfiles_repo = "{{ config_root }}"
nerdfonts_version = "v3.5.1"

[vars.git_name]
required = "Set your Git author name"
prompt = "Git author name"

[vars.git_email]
required = "Set your Git email"
prompt = "Git email"

[dotfiles]
"~/.local/bin/sshkeygen" = { source = "dots/.local/bin/sshkeygen", mode = "symlink" }
"~/.config/dotfiles/env.sh" = { source = "dots/.config/dotfiles/env.sh.tera", mode = "template" }

"~/.config/nerd-fonts/fonts" = { source = "dots/.config/nerd-fonts/fonts", mode = "symlink" }

[bootstrap.packages]
# Ubuntu / Debian packages
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:fontconfig" = "latest"
"apt:git" = "latest"
"apt:openssh-client" = "latest"
"apt:procps" = "latest"
"apt:tar" = "latest"
"apt:xz-utils" = "latest"

# Fedora packages
# The development-tools group is installed by the pre-packages hook.
"dnf:curl" = "latest"
"dnf:file" = "latest"
"dnf:fontconfig" = "latest"
"dnf:git" = "latest"
"dnf:openssh-clients" = "latest"
"dnf:procps-ng" = "latest"
"dnf:tar" = "latest"
"dnf:xz" = "latest"

# Arch Linux packages
"pacman:base-devel" = "latest"
"pacman:curl" = "latest"
"pacman:file" = "latest"
"pacman:fontconfig" = "latest"
"pacman:git" = "latest"
"pacman:openssh" = "latest"
"pacman:procps-ng" = "latest"
"pacman:tar" = "latest"
"pacman:xz" = "latest"

[bootstrap.directories]
"~/repos/github/pszponder" = {}
"~/resources/courses" = {}
"~/resources/books" = {}
"~/resources/datasets" = {}
"~/resources/cheatsheets" = {}
"~/resources/notes" = {}
"~/scratch" = {}
"~/.ssh" = { mode = "0700" }
"~/.ssh/github" = { mode = "0700" }
"~/.ssh/github/pszponder" = { mode = "0700" }

[bootstrap.hooks]
pre-packages = "sh {{ config_root | quote }}/scripts/bootstrap/fedora_development_tools.sh"
final = [
  "bash {{ config_root | quote }}/scripts/bootstrap/create_ssh_keys.sh",
  "NERDFONTS_VERSION={{ vars.nerdfonts_version | quote }} sh {{ config_root | quote }}/scripts/cli/nerdfonts_install.sh",
]
