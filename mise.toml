# Setup tasks use host shell tools; tool installation is an explicit step.
[settings.task]
run_auto_install = false

# Repository maintenance. Machine setup lives in bootstrap/.
[tools]
betterleaks = "latest"

[tasks.hooks-install]
raw = true
description = "Install Betterleaks and enable this repository's Git hooks"
run = [
    "mise install betterleaks",
    "mise run setup:hooks",
]

[tasks.secrets]
description = "Scan all locally available Git history for secrets"
run = "betterleaks git --redact --log-opts=--all"

[tasks.test]
description = "Run offline tests with isolated home directories"
run = "python3 -m unittest discover -s tests -v"

[tasks.lint]
description = "Validate TOML and shell syntax"
run = "python3 scripts/check.py"

[tasks.check]
description = "Run all repository checks"
depends = ["lint", "test"]

[tasks."setup:git"]
raw = true
description = "Attach shared Git defaults while preserving local settings"
run = "mise -C bootstrap -E server run setup:git"

[tasks."setup:tools"]
raw = true
description = "Install configured global tools"
run = "mise -C bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:tools"

[tasks."setup:kanata"]
raw = true
description = "Configure keyboard access on workstations"
run = "mise -C bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:kanata"

[tasks."setup:hooks"]
raw = true
description = "Enable this checkout's Git hooks"
run = "mise -C bootstrap -E server run setup:hooks"

[tasks."setup:ssh"]
raw = true
description = "Create missing SSH keys"
run = "mise -C bootstrap -E server run setup:ssh"

[tasks."setup:fonts"]
raw = true
description = "Install fonts for the selected machine profile"
run = "mise -C bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:fonts"

[tasks."dotfiles:apply"]
description = "Apply dotfiles normally and offer a force retry on failure"
run = "DOTFILES_YES=${DOTFILES_YES:-0} sh scripts/bootstrap/retry_mise.sh dotfiles -C bootstrap -E {{ vars.dotfiles_profile }}"
