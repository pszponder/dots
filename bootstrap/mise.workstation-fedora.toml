[vars]
dotfiles_profile = "workstation-fedora"

[bootstrap.dnf.repos]
ghostty = { copr = "scottames/ghostty" }
helium = { copr = "imput/helium" }

[bootstrap.packages]
"dnf:@development-tools" = "latest"
"dnf:curl" = "latest"
"dnf:file" = "latest"
"dnf:fontconfig" = "latest"
"dnf:git" = "latest"
"dnf:less" = "latest"
"dnf:util-linux" = "latest"
"dnf:openssh-clients" = "latest"
"dnf:procps-ng" = "latest"
"dnf:tar" = "latest"
"dnf:xz" = "latest"
"dnf:ghostty" = "latest"
"flatpak:com.visualstudio.code" = "latest"
"flatpak:md.obsidian.Obsidian" = "latest"
"flatpak:com.discordapp.Discord" = "latest"
"dnf:podman" = "latest"
"dnf:podman-compose" = "latest"
"flatpak-user:io.podman_desktop.PodmanDesktop" = "latest"
"flatpak:app.zen_browser.zen" = "latest"
"dnf:helium-bin" = "latest"

[bootstrap.hooks]
pre-packages = [
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:flatpak",
]
post-packages = [
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:brave-origin",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:zed",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:yaak",
]

[tasks."setup:flatpak"]
raw = true
description = "Prepare Flatpak and Flathub"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/flatpak_install.sh"

[tasks."setup:brave-origin"]
raw = true
description = "Install Brave Origin"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/brave_origin_install.sh"

[tasks."setup:zed"]
raw = true
description = "Install Zed"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/zed_install.sh"

[tasks."setup:yaak"]
raw = true
description = "Install Yaak"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/yaak_install.sh"
