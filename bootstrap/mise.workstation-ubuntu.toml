[vars]
dotfiles_profile = "workstation-ubuntu"

# Prefer project-published, project-endorsed, or Snapcrafters Snaps.
# Zen and Zed use official installers; other apps use explicit fallback sources.
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:fontconfig" = "latest"
"apt:git" = "latest"
"apt:less" = "latest"
"apt:bsdextrautils" = "latest"
"apt:openssh-client" = "latest"
"apt:procps" = "latest"
"apt:tar" = "latest"
"apt:xz-utils" = "latest"
"snap:ghostty" = { classic = true }
"snap:code" = { classic = true }
"snap:obsidian" = { classic = true }
"snap:discord" = "latest"
"apt:podman" = "latest"
"apt:podman-compose" = "latest"

[bootstrap.hooks]
post-packages = [
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:zen",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:helium",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:brave-origin",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:zed",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:yaak",
]

[tasks."setup:zen"]
raw = true
description = "Install Zen with its official tarball installer"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/zen_install.sh"

[tasks."setup:helium"]
raw = true
description = "Install Helium from its apt repository"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/helium_repo.sh"

[tasks."setup:brave-origin"]
raw = true
description = "Install Brave Origin"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/brave_origin_install.sh"

[tasks."setup:zed"]
raw = true
description = "Install Zed"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/zed_install.sh"

[tasks."setup:yaak"]
raw = true
description = "Install Yaak"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/yaak_install.sh"
