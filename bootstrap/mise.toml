# Setup tasks use host shell tools; tool installation is an explicit step.
[settings.task]
run_auto_install = false

# Machine bootstrap. Everyday tools live in dots/.config/mise/.
[vars]
dotfiles_repo = "{{ config_root | dirname }}"
default_terminal = ""
default_browser = ""

nerdfonts_version = "v3.5.1"

[bootstrap.directories]
"~/repos/github/pszponder" = {}
"~/resources/courses" = {}
"~/resources/books" = {}
"~/resources/datasets" = {}
"~/resources/cheatsheets" = {}
"~/resources/notes" = {}
"~/scratch" = {}
"~/.ssh" = { mode = "0700" }
"~/.ssh/github" = { mode = "0700" }
"~/.ssh/github/pszponder" = { mode = "0700" }

[bootstrap.hooks]
post-dotfiles = [
  "{% if vars.dotfiles_profile != 'server' %}mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:defaults{% else %}true{% endif %}",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:git",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:gnome:desktop",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:gnome:power",
]
final = [
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:tools",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:kanata",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:hooks",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:fonts",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:gnome:terminal",
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} run setup:ssh",
]

[tasks."setup:git"]
raw = true
description = "Attach shared Git defaults while preserving local settings"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_git.sh"

[tasks."setup:gnome:desktop"]
raw = true
description = "Apply Ubuntu GNOME desktop preferences"
run = "{% if vars.dotfiles_profile == 'workstation-ubuntu' %}sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_gnome_desktop.sh{% else %}echo 'Skipping desktop setup: Ubuntu profile only'{% endif %}"

[tasks."setup:gnome:terminal"]
raw = true
description = "Configure Catppuccin Ptyxis profiles"
run = "{% if vars.dotfiles_profile != 'server' %}python3 {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_ptyxis.py{% else %}echo 'Skipping terminal setup: workstation profiles only'{% endif %}"

[tasks."setup:gnome:power"]
raw = true
description = "Apply Ubuntu GNOME power and Night Light preferences"
run = "{% if vars.dotfiles_profile == 'workstation-ubuntu' %}sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_gnome_power.sh{% else %}echo 'Skipping power setup: Ubuntu profile only'{% endif %}"

[tasks."setup:defaults"]
raw = true
description = "Apply application defaults for the selected workstation"
run = "{% if vars.dotfiles_profile != 'server' %}sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_defaults.sh {{ vars.default_terminal | quote }} {{ vars.default_browser | quote }}{% else %}echo 'Skipping application defaults: workstation profiles only'{% endif %}"

[tasks."setup:tools"]
raw = true
description = "Install configured global tools"
# Start a fresh invocation to read the global config deployed by dotfiles.
run = "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} install --yes"

[tasks."setup:kanata"]
raw = true
description = "Configure keyboard access on workstations"
run = "{% if vars.dotfiles_profile != 'server' %}sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_kanata.sh{% else %}true{% endif %}"

[tasks."setup:hooks"]
raw = true
description = "Enable this checkout's Git hooks"
run = "sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_git_hooks.sh"

[tasks."setup:ssh"]
raw = true
description = "Create missing SSH keys"
run = "bash {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/create_ssh_keys.sh"

[tasks."setup:fonts"]
raw = true
description = "Install fonts for the selected machine profile"
run = "{% if vars.dotfiles_profile != 'workstation-ublue' %}NERDFONTS_VERSION={{ vars.nerdfonts_version | quote }} sh {{ vars.dotfiles_repo | quote }}/scripts/cli/nerdfonts_install.sh{% else %}echo 'Universal Blue fonts are managed by bootstrap packages'{% endif %}"
