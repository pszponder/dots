# Machine bootstrap. Everyday tools live in dots/.config/mise/.
[vars]
dotfiles_repo = "{{ config_root | dirname }}"

nerdfonts_version = "v3.5.1"

[bootstrap.directories]
"~/repos/github/pszponder" = {}
"~/resources/courses" = {}
"~/resources/books" = {}
"~/resources/datasets" = {}
"~/resources/cheatsheets" = {}
"~/resources/notes" = {}
"~/scratch" = {}
"~/.ssh" = { mode = "0700" }
"~/.ssh/github" = { mode = "0700" }
"~/.ssh/github/pszponder" = { mode = "0700" }

[bootstrap.hooks]
pre-dotfiles = [
  "python3 {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/backup_dotfiles.py",
]
final = [
  # A fresh invocation reads the global tools config deployed by dotfiles.
  "mise -C {{ vars.dotfiles_repo | quote }}/bootstrap -E {{ vars.dotfiles_profile | quote }} install --yes",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/configure_git_hooks.sh",
  # Flox installation is disabled for now; uncomment to enable it again.
  # "sh {{ vars.dotfiles_repo | quote }}/scripts/cli/flox_install.sh",
  "bash {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/create_ssh_keys.sh",
  "{% if vars.dotfiles_profile != 'workstation-ublue' %}NERDFONTS_VERSION={{ vars.nerdfonts_version | quote }} sh {{ vars.dotfiles_repo | quote }}/scripts/cli/nerdfonts_install.sh{% else %}true{% endif %}",
]

