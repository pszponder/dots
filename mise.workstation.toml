[vars]
dotfiles_profile = "workstation"

[bootstrap.packages]
"flatpak:dev.zed.Zed" = "latest"
# Requires Ubuntu 26.04 or newer.
"apt:ghostty" = "latest"
"pacman:ghostty" = "latest"
"dnf:ghostty" = "latest"

[bootstrap.hooks]
post-dotfiles = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/configure_wallpaper.sh",
]
pre-packages = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/flatpak_install.sh",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/bootstrap/setup_copr.sh",
]
