[vars]
dotfiles_profile = "workstation"

[bootstrap.packages]
"snap:ghostty" = { classic = true }
"apt:ghostty" = "latest"
"pacman:ghostty" = "latest"
"dnf:ghostty" = "latest"

# Requires mise with native COPR support.
[bootstrap.dnf.repos]
ghostty = { copr = "scottames/ghostty" }

[bootstrap.hooks]
post-dotfiles = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/configure_wallpaper.sh",
]
pre-packages = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/flatpak_install.sh",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/zed_install.sh",
]
