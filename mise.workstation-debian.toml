[vars]
dotfiles_profile = "workstation-debian"

# Ghostty requires an existing apt repository providing the package.
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:fontconfig" = "latest"
"apt:git" = "latest"
"apt:less" = "latest"
"apt:bsdextrautils" = "latest"
"apt:openssh-client" = "latest"
"apt:procps" = "latest"
"apt:tar" = "latest"
"apt:xz-utils" = "latest"
"apt:ghostty" = "latest"
"flatpak:com.visualstudio.code" = "latest"
"flatpak:md.obsidian.Obsidian" = "latest"
"flatpak:com.discordapp.Discord" = "latest"
"apt:podman" = "latest"
"apt:podman-compose" = "latest"
"flatpak-user:io.podman_desktop.PodmanDesktop" = "latest"
"flatpak:app.zen_browser.zen" = "latest"

[bootstrap.hooks]
post-dotfiles = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/configure_wallpaper.sh",
]
pre-packages = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/flatpak_install.sh",
]
post-packages = [
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/helium_repo.sh",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/brave_origin_install.sh",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/zed_install.sh",
  "sh {{ vars.dotfiles_repo | quote }}/scripts/gui/yaak_install.sh",
]
